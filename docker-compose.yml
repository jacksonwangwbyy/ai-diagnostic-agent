services:
  # AI 诊断 Agent 服务
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 持久化 ChromaDB 数据
      - ./chroma_data:/app/chroma_data
      # 持久化知识库
      - ./knowledge-base:/app/knowledge-base
    depends_on:
      - milvus
    restart: unless-stopped

  # Milvus 向量数据库（生产级）
  milvus:
    image: milvusdb/milvus:v2.4-latest
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: "local"
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped

volumes:
  milvus_data:
