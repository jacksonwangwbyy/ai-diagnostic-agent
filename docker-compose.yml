services:
  # AI 诊断 Agent 服务
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./knowledge-base:/app/knowledge-base
    depends_on:
      - redis
      - milvus
    restart: unless-stopped

  # Redis（对话历史持久化）
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Milvus 向量数据库（生产级）
  milvus:
    image: milvusdb/milvus:v2.4-latest
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: "local"
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped

volumes:
  redis_data:
  milvus_data:
